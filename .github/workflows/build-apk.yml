name: Build APK (arm64 full)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 仅构建 64 位完整版 APK
  build-arm64-full:
    runs-on: ubuntu-latest
    env:
      # step 级 if 无法读取 secrets，用 job 级 env 中转（fork 无密钥时为 false）
      KEYSTORE_READY: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 缓存 Android SDK
      uses: actions/cache@v3
      with:
        path: /usr/local/lib/android/sdk
        key: ${{ runner.os }}-android-sdk

    - name: 缓存 Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-full-${{ hashFiles('**/*.gradle*', '**/*.properties') }}

    - name: 缓存 Flutter pub
      uses: actions/cache@v3
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-full-${{ hashFiles('pubspec.lock') }}

    - name: 设置 Java 环境
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 设置 Flutter 环境
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'
        channel: 'stable'
        cache: true

    - name: 获取依赖
      run: flutter pub get

    - name: 运行代码分析
      run: flutter analyze

    - name: 解码签名密钥
      if: env.KEYSTORE_READY == 'true'
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=keystore.jks" >> android/key.properties

    - name: 构建 arm64 Full 版本 APK
      run: |
        if [ -f android/app/keystore.jks ]; then
          flutter build apk --release --flavor full --target-platform android-arm64
        else
          # fork 无签名密钥时构建 debug 版本（可直接安装）
          flutter build apk --debug --flavor full --target-platform android-arm64
        fi

    - name: 重命名 APK
      run: |
        cd build/app/outputs/flutter-apk
        [ -f app-full-release.apk ] && mv app-full-release.apk voice-book-arm64-full.apk || true
        [ -f app-full-debug.apk ] && mv app-full-debug.apk voice-book-arm64-full.apk || true
        [ -f app-arm64-v8a-full-release.apk ] && mv app-arm64-v8a-full-release.apk voice-book-arm64-full.apk || true
        [ -f app-arm64-v8a-full-debug.apk ] && mv app-arm64-v8a-full-debug.apk voice-book-arm64-full.apk || true

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-arm64-full
        path: build/app/outputs/flutter-apk/voice-book-arm64-full.apk
        retention-days: 30
        if-no-files-found: error